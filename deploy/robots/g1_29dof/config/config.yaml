    fps: 60
    motion_file: config/policy/mimic/neutral_walk_forward/params/neutral_walk_forward.csv
    policy_dir: config/policy/mimic/neutral_walk_forward/
  Mimic_Jump:
    transitions:
      Passive: LT + B.on_pressed
      Velocity: RB + X.on_pressed
    fps: 50
    motion_file: config/policy/mimic/jump/params/jump.csv
