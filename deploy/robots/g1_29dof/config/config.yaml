    fps: 50
    motion_file: config/policy/mimic/pico_righttaitui/params/pico_righttaitui.csv
    policy_dir: config/policy/mimic/pico_righttaitui/
  Mimic_Dun:
    transitions:
      Passive: LT + B.on_pressed
      Velocity: RB + X.on_pressed
    fps: 50
    motion_file: config/policy/mimic/dun/params/dun.csv
